name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at the same time
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: "hostpoint doc.fortysix.ch"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables)
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}   # ftp | ftps | ftps-legacy
          port: ${{ vars.FTP_PORT || 21 }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }} # must end with a slash, e.g. public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
